# Beissfest. nginx ist reiner Vermittler -- kein eigenes Webroot.
# ACHTUNG: nginx 1.24 auf diesem Host -> "listen 443 ssl http2;",
# NICHT das neuere "http2 on;" (gibt es erst ab 1.25).

server {
    listen 80;
    listen [::]:80;
    server_name beissfest.celox.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beissfest.celox.io;

    ssl_certificate     /etc/letsencrypt/live/beissfest.celox.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beissfest.celox.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Der Node-Prozess setzt diese Kopfzeilen selbst -- sonst stehen sie doppelt.
    proxy_hide_header X-Powered-By;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Spielverbindung. Ohne den langen Timeout trennt nginx ruhige
    # Verbindungen nach 60 s mitten in der Runde.
    location /ws {
        proxy_pass http://127.0.0.1:4263;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:4263;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
